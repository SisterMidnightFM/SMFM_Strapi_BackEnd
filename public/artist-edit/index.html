<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Edit Your Artist Page — Sister Midnight FM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #14121a;
      color: #f2eef7;
      line-height: 1.5;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .meta { color: #b3a9c9; margin: 0 0 24px; font-size: 0.95rem; }
    label { display: block; font-weight: 600; margin: 20px 0 6px; }
    .hint { font-weight: 400; color: #b3a9c9; font-size: 0.85rem; }
    input[type="text"], input[type="email"], textarea {
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #4a4160;
      background: #1f1b2a;
      color: #f2eef7;
    }
    input:focus, textarea:focus { outline: 2px solid #a37cf0; border-color: transparent; }
    textarea { min-height: 160px; resize: vertical; }
    .btn {
      font-size: 16px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #a37cf0;
      color: #14121a;
      font-weight: 700;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .banner { padding: 12px 16px; border-radius: 8px; margin: 20px 0; display: none; }
    .banner.show { display: block; }
    .banner.success { background: #1d3a2a; color: #9ff0bd; }
    .banner.error { background: #3f1f2b; color: #ffb3c6; }
    .save-row { margin-top: 28px; }
    #loading, #fatal { text-align: center; padding: 60px 16px; color: #b3a9c9; }
    #fatal { display: none; }
    #form { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading">Loading your artist page…</div>
    <div id="fatal"></div>

    <div id="form">
      <h1 id="heading">Edit your artist page</h1>
      <p class="meta">Sister Midnight FM</p>

      <div class="banner" id="banner"></div>

      <label for="name">Artist name</label>
      <input type="text" id="name" maxlength="255" />

      <label for="bio">Bio <span class="hint">(shown on your page)</span></label>
      <textarea id="bio" placeholder="Tell listeners about yourself…"></textarea>

      <label for="instagram">Instagram</label>
      <input type="text" id="instagram" placeholder="https://instagram.com/…" />

      <label for="website">Website</label>
      <input type="text" id="website" placeholder="https://…" />

      <label for="email">Contact email <span class="hint">(kept private — how we reach you)</span></label>
      <input type="email" id="email" />

      <div class="save-row">
        <button type="button" class="btn" id="save">Save changes</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
