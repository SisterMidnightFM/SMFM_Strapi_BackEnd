<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Edit Your Episode — Sister Midnight FM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #14121a;
      color: #f2eef7;
      line-height: 1.5;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .meta { color: #b3a9c9; margin: 0 0 24px; font-size: 0.95rem; }
    label { display: block; font-weight: 600; margin: 20px 0 6px; }
    .hint { font-weight: 400; color: #b3a9c9; font-size: 0.85rem; }
    input[type="text"], textarea {
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #4a4160;
      background: #1f1b2a;
      color: #f2eef7;
    }
    input:focus, textarea:focus { outline: 2px solid #a37cf0; border-color: transparent; }
    textarea { min-height: 120px; resize: vertical; }
    .track-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .track-row input { flex: 1; min-width: 0; }
    .btn {
      font-size: 16px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #a37cf0;
      color: #14121a;
      font-weight: 700;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary { background: #2c2540; color: #f2eef7; font-weight: 500; }
    .btn-remove {
      background: none; border: none; color: #b3a9c9; font-size: 20px;
      cursor: pointer; padding: 4px 8px; line-height: 1;
    }
    .btn-remove:hover { color: #ff7b9c; }
    .genres { display: flex; flex-wrap: wrap; gap: 8px; }
    .genres label {
      display: inline-flex; align-items: center; gap: 6px;
      margin: 0; padding: 8px 12px; font-weight: 400; font-size: 0.95rem;
      background: #1f1b2a; border: 1px solid #4a4160; border-radius: 20px;
      cursor: pointer; user-select: none;
    }
    .genres label:has(input:checked) { background: #3a2d5c; border-color: #a37cf0; }
    .genres input { accent-color: #a37cf0; }
    .banner {
      padding: 12px 16px; border-radius: 8px; margin: 20px 0; display: none;
    }
    .banner.show { display: block; }
    .banner.success { background: #1d3a2a; color: #9ff0bd; }
    .banner.error { background: #3f1f2b; color: #ffb3c6; }
    .save-row { margin-top: 28px; }
    #loading, #fatal { text-align: center; padding: 60px 16px; color: #b3a9c9; }
    #fatal { display: none; }
    #form { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading">Loading your episode…</div>
    <div id="fatal"></div>

    <div id="form">
      <h1 id="heading">Edit your episode</h1>
      <p class="meta" id="meta"></p>

      <div class="banner" id="banner"></div>

      <label for="title">Episode title</label>
      <input type="text" id="title" maxlength="255" />

      <label for="description">Episode description</label>
      <textarea id="description" placeholder="Tell listeners what this episode is about…"></textarea>

      <label>Tracklist <span class="hint">(artist and track title for each song played)</span></label>
      <div id="tracklist"></div>
      <button type="button" class="btn btn-secondary" id="add-track">+ Add track</button>

      <label>Genres <span class="hint">(select all that apply)</span></label>
      <div class="genres" id="genres"></div>

      <div class="save-row">
        <button type="button" class="btn" id="save">Save changes</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
